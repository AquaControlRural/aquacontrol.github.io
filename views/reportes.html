<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h3>
            <i class="bi bi-file-earmark-bar-graph-fill text-primary"></i>
            Reportes
        </h3>

        <div>

            <button class="btn btn-success me-2" id="btnExcel">
                <i class="bi bi-file-earmark-excel"></i>
                Excel
            </button>

            <button class="btn btn-danger me-2" id="btnPDF">
                <i class="bi bi-file-earmark-pdf"></i>
                PDF
            </button>

            <button class="btn btn-primary" onclick="window.print()">
                <i class="bi bi-printer"></i>
                Imprimir
            </button>

        </div>

    </div>

    <!-- TARJETAS -->

    <div class="row g-3 mb-4">

        <div class="col-lg-2 col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-tools fs-2 text-primary"></i>

                    <h6 class="mt-2">Mantenimientos</h6>

                    <h3 id="repMantenimientos">0</h3>

                </div>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-currency-dollar fs-2 text-success"></i>

                    <h6 class="mt-2">Costo Total</h6>

                    <h3 id="repCosto">$0</h3>

                </div>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-gear-fill fs-2 text-warning"></i>

                    <h6 class="mt-2">Bombas</h6>

                    <h3 id="repBombas">0</h3>

                </div>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-box-seam fs-2 text-info"></i>

                    <h6 class="mt-2">Materiales</h6>

                    <h3 id="repInventario">0</h3>

                </div>

            </div>

        </div>

        <div class="col-lg-4 col-md-8">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-exclamation-triangle-fill fs-2 text-danger"></i>

                    <h6 class="mt-2">Materiales Bajo Stock</h6>

                    <h3 id="repBajoStock">0</h3>

                </div>

            </div>

        </div>

    </div>

    <!-- GRAFICAS -->

    <div class="row g-4">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header">

                    Mantenimientos por Estado

                </div>

                <div class="card-body">

                    <canvas id="grafEstadoCanvas"></canvas>


                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header">

                    Inventario por Categoría

                </div>

                <div class="card-body">

                    <canvas id="grafCategoriaCanvas"></canvas>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header">

                    Costos Mensuales

                </div>

                <div class="card-body">

                    <canvas id="grafCostosCanvas"></canvas>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header">

                    Bombas por Estado

                </div>

                <div class="card-body">

                    <canvas id="grafBombas"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>
