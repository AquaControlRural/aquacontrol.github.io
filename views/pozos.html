<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                Pozos

            </h2>

            <p class="text-muted mb-0">

                Administración de pozos

            </p>

        </div>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalPozo">

            <i class="bi bi-plus-circle me-2"></i>

            Nuevo Pozo

        </button>

    </div>

    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-4">

                    <input
                        class="form-control"
                        id="buscarPozo"
                        placeholder="Buscar pozo...">

                </div>

            </div>

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle"
                    id="tablaPozos">

                    <thead class="table-light">

                        <tr>

                            <th width="60">#</th>

                            <th>Pozo</th>

                            <th>Comunidad</th>

                            <th>Tipo</th>

                            <th>Profundidad</th>

                            <th>Caudal</th>

                            <th>Estado</th>

                            <th width="170" class="text-center">

                                Acciones

                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td colspan="8" class="text-center text-muted">

                                No hay pozos registrados.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div
    class="modal fade"
    id="modalPozo"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Nuevo Pozo

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Nombre del pozo

                        </label>

                        <input
                            id="txtPozo"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Comunidad

                        </label>

                        <select
                            id="cmbComunidad"
                            class="form-select">

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Tipo

                        </label>

                        <select
                            id="cmbTipo"
                            class="form-select">

                            <option>Profundo</option>

                            <option>Somero</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Profundidad (m)

                        </label>

                        <input
                            type="number"
                            id="txtProfundidad"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Caudal (L/s)

                        </label>

                        <input
                            type="number"
                            id="txtCaudal"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Estado

                        </label>

                        <select
                            id="cmbEstadoPozo"
                            class="form-select">

                            <option>Activo</option>

                            <option>Mantenimiento</option>

                            <option>Fuera de servicio</option>

                        </select>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    class="btn btn-primary"
                    id="btnGuardarPozo">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>
