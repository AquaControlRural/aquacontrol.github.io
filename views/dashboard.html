<div class="container-fluid">

    <!-- Encabezado -->
    <div class="mb-4">

        <h2 class="fw-bold">
            Dashboard
        </h2>

        <p class="text-muted">
            Resumen general del sistema AquaControl Rural
        </p>

    </div>

    <!-- Tarjetas -->
    <div class="row g-4 mb-4" id="cardsContainer">

        <!-- Se generan desde dashboard.js -->

    </div>

    <!-- Gráfica y Actividad -->
    <div class="row g-4">

        <!-- Gráfica -->
        <div class="col-12 col-xl-8">

            <div class="card shadow-sm border-0 rounded-4 h-100">

                <div class="card-header bg-white border-0 rounded-top-4 d-flex justify-content-between align-items-center">

                    <h5 class="mb-0 fw-semibold">

                        Mantenimientos por Mes

                    </h5>

                    <div class="d-flex gap-2">

                        <select
                            id="yearChart"
                            class="form-select form-select-sm"
                            style="width:110px;">

                            <option value="2026">2026</option>

                            <option value="2025">2025</option>

                            <option value="2024">2024</option>

                        </select>

                        <select
                            id="typeChart"
                            class="form-select form-select-sm"
                            style="width:170px;">

                            <option value="todos">

                                Todos

                            </option>

                            <option value="preventivos">

                                Preventivos

                            </option>

                            <option value="correctivos">

                                Correctivos

                            </option>

                        </select>

                    </div>

                </div>

                <div class="card-body" style="height:420px;">

                    <canvas id="chartMaintenances"></canvas>

                </div>

            </div>

        </div>

        <!-- Actividad -->
        <div class="col-12 col-xl-4">

            <div class="card shadow-sm border-0 rounded-4 h-100">

                <div class="card-header bg-white border-0 rounded-top-4">

                    <h5 class="mb-0 fw-semibold">

                        Actividad Reciente

                    </h5>

                </div>

                <div
                    class="card-body"
                    id="recentActivity">

                    <div class="text-center py-5 text-muted">

                        <div
                            class="spinner-border spinner-border-sm me-2"
                            role="status">

                        </div>

                        Cargando actividad...

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Alertas y Mantenimientos -->
    <div class="row mt-4 g-4">

        <!-- Alertas -->

        <div class="col-12 col-lg-6">

            <div class="card shadow-sm border-0 rounded-4 h-100">

                <div class="card-header bg-white border-0">

                    <h5 class="mb-0 fw-semibold">

                        <i class="bi bi-bell-fill text-danger me-2"></i>

                        Alertas del Sistema

                    </h5>

                </div>

                <div
                    class="card-body"
                    id="systemAlerts">

                    <div class="text-center py-5 text-muted">

                        <div
                            class="spinner-border spinner-border-sm me-2"
                            role="status">

                        </div>

                        Cargando alertas...

                    </div>

                </div>

            </div>

        </div>

        <!-- Próximos mantenimientos -->

        <div class="col-12 col-lg-6">

            <div class="card shadow-sm border-0 rounded-4 h-100">

                <div class="card-header bg-white border-0">

                    <h5 class="mb-0 fw-semibold">

                        <i class="bi bi-calendar-event-fill text-primary me-2"></i>

                        Próximos Mantenimientos

                    </h5>

                </div>

                <div
                    class="card-body"
                    id="nextMaintenance">

                    <div class="text-center py-5 text-muted">

                        <div
                            class="spinner-border spinner-border-sm me-2"
                            role="status">

                        </div>

                        Cargando mantenimientos...

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
