<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h3>
            <i class="bi bi-box-seam-fill text-primary"></i>
            Inventario
        </h3>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalInventario">

            <i class="bi bi-plus-circle"></i>
            Nuevo Material

        </button>

    </div>

    <!-- Tarjetas -->

    <div class="row g-3 mb-4">

        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h6>Total Materiales</h6>

                    <h2 id="totalMateriales">0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h6>Bajo Stock</h6>

                    <h2 class="text-danger" id="bajoStock">0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h6>Valor Inventario</h6>

                    <h2 id="valorInventario">$0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h6>Categorías</h6>

                    <h2 id="totalCategorias">0</h2>

                </div>

            </div>

        </div>

    </div>

    <!-- Tabla -->

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover align-middle" id="tablaInventario">

                <thead class="table-primary">

                    <tr>

                        <th>#</th>

                        <th>Material</th>

                        <th>Categoría</th>

                        <th>Cantidad</th>

                        <th>Unidad</th>

                        <th>Precio</th>

                        <th>Estado</th>

                        <th class="text-center">Acciones</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Modal -->

<div
    class="modal fade"
    id="modalInventario"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Nuevo Material

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Material

                        </label>

                        <input
                            id="txtMaterial"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Categoría

                        </label>

                        <select
                            id="cmbCategoria"
                            class="form-select">

                            <option>Tubería</option>

                            <option>Conexiones</option>

                            <option>Herramienta</option>

                            <option>Equipo</option>

                            <option>Eléctrico</option>

                            <option>Otro</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Cantidad</label>

                        <input
                            id="txtCantidad"
                            type="number"
                            class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Unidad</label>

                        <input
                            id="txtUnidad"
                            class="form-control"
                            placeholder="Piezas">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Precio</label>

                        <input
                            id="txtPrecio"
                            type="number"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Stock mínimo</label>

                        <input
                            id="txtStock"
                            type="number"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Proveedor</label>

                        <input
                            id="txtProveedor"
                            class="form-control">

                    </div>

                    <div class="col-12">

                        <label>Descripción</label>

                        <textarea
                            id="txtDescripcion"
                            rows="3"
                            class="form-control"></textarea>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    class="btn btn-primary"
                    id="btnGuardarMaterial">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>
