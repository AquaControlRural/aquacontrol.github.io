<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaControl Rural</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">

        <div class="container-fluid">

            <!-- Botón móvil -->

            <button
                class="btn btn-primary d-lg-none"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebarMovil">

                <i class="bi bi-list"></i>

            </button>

            <!-- Logo -->

            <a class="navbar-brand fw-bold ms-2" href="#">

                💧 AquaControl Rural

            </a>

            <!-- Derecha -->

            <div class="ms-auto d-flex align-items-center gap-2">

                <button class="btn btn-light position-relative">

                    <i class="bi bi-bell fs-5"></i>

                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

                        3

                    </span>

                </button>

                <div class="dropdown">

                    <button
                        class="btn btn-light dropdown-toggle d-flex align-items-center"
                        data-bs-toggle="dropdown">

                        <i class="bi bi-person-circle me-2"></i>

                        <span class="d-none d-md-inline">

                            Administrador

                        </span>

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>

                            <a class="dropdown-item" href="#">

                                Mi Perfil

                            </a>

                        </li>

                        <li>

                            <a class="dropdown-item" href="#">

                                Configuración

                            </a>

                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>

                            <a class="dropdown-item text-danger" href="#">

                                Cerrar sesión

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </nav>

    <!-- ================= SIDEBAR ESCRITORIO ================= -->

    <aside class="sidebar d-none d-lg-block">

        <div class="logo">

            <i class="bi bi-droplet-fill"></i>

            <h2>AquaControl</h2>

            <span>Rural</span>

        </div>

        <hr>

        <ul class="nav flex-column" id="menuDesktop">

            <!-- Se genera con menu.js -->

        </ul>

    </aside>

    <!-- ================= SIDEBAR MOVIL ================= -->

    <div
        class="offcanvas offcanvas-start"
        tabindex="-1"
        id="sidebarMovil">

        <div class="offcanvas-header">

            <h5>

                💧 AquaControl

            </h5>

            <button
                class="btn-close"
                data-bs-dismiss="offcanvas">

            </button>

        </div>

        <div class="offcanvas-body">

            <ul class="nav flex-column" id="menuMovil">

                <!-- Se genera con menu.js -->

            </ul>

        </div>

    </div>

    <!-- ================= CONTENIDO ================= -->

    <main class="contenido">

        <!-- Breadcrumb -->

        <nav class="mb-3">

            <ol class="breadcrumb">

                <li class="breadcrumb-item">

                    <i class="bi bi-house"></i>

                </li>

                <li
                    class="breadcrumb-item active"
                    id="breadcrumb">

                    Dashboard

                </li>

            </ol>

        </nav>

        <!-- Aquí se cargan las vistas -->

        <div id="contenidoPrincipal">

        </div>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer class="text-center py-3">

        AquaControl Rural © 2026

    </footer>

    <!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase -->

    <script type="module" src="assets/js/firebase.js"></script>

    <!-- Menú -->

    <script type="module" src="assets/js/menu.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Router -->

    <script type="module" src="assets/js/router.js"></script>

    <!-- App -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script type="module" src="assets/js/app.js"></script>

</body>

</html>
